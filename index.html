<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="style_new.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TicTacToe</h1>
            <div class="controls">
                <button id="newGame" class="btn">New Game</button>
                <button id="settingsBtn" class="btn">Settings</button>
            </div>
        </header>

        <main id="gameArea">
            <div class="game-info">
                <div id="currentPlayer">Current Player: X</div>
                <div id="gameStatus"></div>
            </div>

            <div class="game-board" id="gameBoard">
                <div class="cell" data-cell="0"></div>
                <div class="cell" data-cell="1"></div>
                <div class="cell" data-cell="2"></div>
                <div class="cell" data-cell="3"></div>
                <div class="cell" data-cell="4"></div>
                <div class="cell" data-cell="5"></div>
                <div class="cell" data-cell="6"></div>
                <div class="cell" data-cell="7"></div>
                <div class="cell" data-cell="8"></div>
            </div>
        </main>

        <div id="settingsPanel" class="settings-panel hidden">
            <h2>Game Settings</h2>
            
            <div class="setting-group">
                <label>Game Mode:</label>
                <select id="gameMode">
                    <option value="human">Human vs Human</option>
                    <option value="ai">Human vs AI</option>
                </select>
            </div>

            <div class="setting-group">
                <label>First Player:</label>
                <select id="firstPlayer">
                    <option value="X">X goes first</option>
                    <option value="O">O goes first</option>
                </select>
            </div>

            <div class="setting-group" id="aiDifficultyGroup">
                <label>AI Difficulty:</label>
                <select id="aiDifficulty">
                    <option value="easy">Easy</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div class="settings-actions">
                <button id="applySettings" class="btn">Apply</button>
                <button id="cancelSettings" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script_new.js"></script>
</body>
</html>
